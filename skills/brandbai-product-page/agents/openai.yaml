interface:
  display_name: "BrandBAI 商品页诊断优化"
  short_description: "先整体诊断商品页，再给出新版购买逻辑与项目级重构方案"
  default_prompt: "使用 $brandbai-product-page 诊断这个商品的现有主图、交易区和详情页。先识别页面主讲SKU并确认它存在于交易区可见选项，再总结当前成交策略、已经做对的部分和最多三个整体根因；随后给出新版购买逻辑、主图/交易区/详情页分工，以及最多五个绑定整体根因的改版项目。逐图建议只作为执行层。每个购买判断分别写明已讲清、没讲清、购买影响和补法。检测资料先判断差异是否影响被证明的结论，不因包装克重不同自动判无效。每个改版项目必须填写四种正式建议标签之一，普通版只使用品牌业务语言，不展示上游、返回上游等内部流程词。"
