interface:
  display_name: "BrandBAI 商品页诊断优化"
  short_description: "匹配细分类目购买决策链与页面内容链，形成项目级优化方案"
  default_prompt: "使用 $brandbai-product-page 诊断这个商品的现有主图、交易区和详情页。先识别页面主讲SKU并确认它存在于交易区可见选项；多SKU页面读取全部可售规格与主图映射，只用目标SKU对应主图库评价主图。方法只使用一核、两链、五问：建立细分类目用户购买决策链，还原当前页面内容链，再用认对、看懂、相信、选对、放心买复核。品牌正文先讲最大的购买断点，再用不超过三个“页面现状＋购买影响”解释问题，并给出一条改版后建议顺序和最多五个改版项目。主图逐张安排任务；天猫／淘宝交易区只给一个平台可实施的主要规格选择区方案，不把用户阅读顺序画成多个选择器；详情页按连续内容章节重构，不逐图挑错。检测资料先判断差异是否影响被证明的结论，不因包装克重不同自动判无效。专业模式固定输出两份品牌可读文档：诊断与优化建议、主图交易区详情页优化页纲。"
