name: validate-skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate public skill tree
        run: python scripts/validate_repo.py
      - name: Test standalone Skill release package
        run: python -m unittest scripts/test_build_skill_release.py
      - name: Run Douyin collector unit tests
        working-directory: skills/brandbai-douyin-download/scripts
        run: >-
          python -m unittest
          test_download_creator_works.py
          test_browser_collect_comments.py
          test_run_foundation.py
          test_run_long_job.py
          test_build_foundation_workbooks.py
      - name: Run Douyin account analysis unit tests
        working-directory: skills/brandbai-douyin-account-analysis/scripts
        run: python -m unittest test_analysis_dataset.py test_analysis_delivery.py
